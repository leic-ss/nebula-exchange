{
  # Spark config
  spark: {
    app: {
      name: Nebula Exchange
    }
  }

  # if the hive is hive-on-spark with derby mode， you can ignore this hive configure
  # get the com.vesoft.exchange.common.config values from file $HIVE_HOME/conf/hive-site.xml or hive-default.xml

  #  hive: {
  #    warehouse: "hdfs://NAMENODE_IP:9000/apps/svr/hive-xxx/warehouse/"
  #    connectionURL: "jdbc:mysql://your_ip:3306/hive_spark?characterEncoding=UTF-8"
  #    connectionDriverName: "com.mysql.jdbc.Driver"
  #    connectionUserName: "user"
  #    connectionPassword: "password"
  #  }

  # Nebula Graph config
  nebula: {
    address:{
      graph:["10.48.128.50:9669","10.48.40.231:9669","10.48.40.232:9669"]
      meta:["10.48.128.50:9559","10.48.40.231:9559","10.48.40.232:9559"]
    }
    user: root
    pswd: nebula
    space: brandnode

    # if com.vesoft.exchange.common.config graph ssl encrypted transmission
    ssl:{
        # if enable is false, other params of ssl are invalid.
        enable:{
            graph:false
            meta:false
        }
        # ssl sign type: CA or SELF
        sign.type:ca

        # if sign.type is CA, make sure com.vesoft.exchange.common.config the ca.param. If you submit exchange application with cluster, please make sure each worker has the ca files.
        ca.param: {
            caCrtFilePath:"/path/caCrtFilePath"
            crtFilePath:"/path/crtFilePath"
            keyFilePath:"/path/keyFilePath"
        }

        # if sign.type is SELF, make sure com.vesoft.exchange.common.config the self.param. If you submit exchange application with cluster, please make sure each worker has the ca files.
        self.param: {
            crtFilePath:"/path/crtFilePath"
            keyFilePath:"/path/keyFilePath"
            password:"nebula"
        }
    }

    # parameters for SST import, not required
    path:{
        local:"/tmp"
        remote:"/user/music_datahub/pandora/datahub/zhanglei09"
        hdfs.namenode: "hdfs://hz-cluster11"
    }

    # nebula client connection parameters
    connection {
      # socket connect & execute timeout, unit: millisecond
      timeout: 30000
    }

    error: {
      # max number of failures, if the number of failures is bigger than max, then exit the application.
      max: 32
      # failed import job will be recorded in output path
      output: /tmp/errors
    }

    # use google's RateLimiter to limit the requests send to NebulaGraph
    rate: {
      # the stable throughput of RateLimiter
      limit: 1024
      # Acquires a permit from RateLimiter, unit: MILLISECONDS
      # if it can't be obtained within the specified timeout, then give up the request.
      timeout: 1000
    }
  }

  # Processing tags
  # There are tag com.vesoft.exchange.common.config examples for different dataSources.

  edges: [
    {
      type: {
        source: hive
        sink: sst
      }
      cmd: "CREATE EDGE IF NOT EXISTS %s(from_artist_name string, to_artist_name string);"
      exec: "select from_artist_id, from_artist_name, to_artist_id, to_artist_name, relation_id from music_new_dm.ads_onetag_graph_relation_artist_2_dd where %s;"
      fields: [from_artist_name, to_artist_name]
      nebula.fields: [from_artist_name, to_artist_name]
      source: from_artist_id
      target: to_artist_id
      edge.field: relation_id
    }

    {
      name: relation_song_writer_artist
      type: {
        source: hive
        sink: sst
      }
      cmd: "CREATE EDGE IF NOT EXISTS %s(song_name string, writer_artist_name string);"
      exec: "select song_id, song_name, writer_artist_id, writer_artist_name from music_new_dm.ads_onetag_graph_relation_song_writer_artist_dd where %s;"
      fields: [song_name, writer_artist_name]
      nebula.fields: [song_name, writer_artist_name]
      source: song_id
      target: writer_artist_id
    }
  ]
}